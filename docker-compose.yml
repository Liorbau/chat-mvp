services:
  mongo:
    image: mongo:7
    container_name: chat-mongo
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - chat-mongo-data:/data/db
    healthcheck:
      # Doubles as a one-time initializer: if the replica set is not yet
      # initiated, rs.status() throws and we run rs.initiate(); afterwards it
      # just reports status. This makes `docker compose up` self-initializing,
      # so transactions work with no manual step.
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }",
        ]
      interval: 5s
      timeout: 30s
      retries: 12
      start_period: 5s

volumes:
  chat-mongo-data:
